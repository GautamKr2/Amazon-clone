<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <!-- Navigation begin -->
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-address border">
                <p id="add-type"> Deliver to </p>
                <div class="add-icon">
                    <div style="padding-right: 4px;"><i class="fa-solid fa-location-dot"></i></div>
                    <p class="second"> India </p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option> All </option>
                    <option> Electronics </option>
                    <option> Books </option>
                    <option> Beauty and Personal Care </option>
                    <option> Automaotive </option>
                    <option> Home Kitchen </option>
                </select>
                <input type="text" placeholder="Search Amazon" id="search-field" />
                <div id="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-signin border">
                <p><span> Hello, sign in </span></p>
                <p class="second"> Accounts & Lists </p>
            </div>

            <div class="nav-return border">
                <p><span> Returns </span></p>
                <p class="second"> & Orders </p>
            </div>

            <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                <p class="second"> Cart </p>
            </div>
        </div>


        <div class="panel">
            <div class="panel-all border">
                <i class="fa-solid fa-bars"></i>
                All
            </div>

            <div class="panel-options">
                <p class="border"> Today's Deals </p>
                <p class="border"> Prime Video </p>
                <p class="border"> Gift Cards </p>
                <p class="border"> Customer Service </p>
                <p class="border"> Sell </p>
                <p class="border"> Registry </p>
            </div>

            <div class="shop-deal second border">
                <p> Shop deals in Electronics </p>
            </div>
        </div>
    </header>
    <!-- Navigation end -->


    <!-- Main body starts -->
    <section class="main">
       <h2> Welcome to Home Page. </h2>
    </section>
    <!-- Main body ends -->


    <!-- Footer section -->
    <footer class="footer">
        <p> &copy;; 2026 Amazon clone. All rights reserved. </p>
    </footer>
</body>
</html>
